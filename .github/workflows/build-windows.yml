# Build the Windows NSIS installer (BiWrite_<version>_x64-setup.exe) on
# GitHub's Windows runner and upload it as a workflow artifact.
# Trigger it from the Actions tab (workflow_dispatch) or by pushing to master.
# MSI/WiX is intentionally not built (it needs Windows-only tooling and the
# VBSCRIPT optional feature); NSIS is the installer we ship for a first test.
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "crates/**"
      - "package.json"
      - "package-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-windows.yml"

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: NSIS installer (x64)
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app and the NSIS installer
        run: npx tauri build --bundles nsis

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: biwrite-windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
