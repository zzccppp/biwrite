# Build the installers on GitHub's runners:
#   - Windows: NSIS installer, BiWrite_<version>_x64-setup.exe
#   - macOS:   universal DMG (Apple Silicon + Intel), BiWrite_<version>_universal.dmg
#
# - Push to master (code changes) or run from the Actions tab: the installers
#   are uploaded as workflow artifacts (Actions → run → Artifacts).
# - Push a version tag `v<version>` (e.g. `git tag v0.1.0 && git push origin
#   v0.1.0`): the same build, then a GitHub Release with both installers. The
#   tag must match the version in src-tauri/tauri.conf.json; a tag with a
#   suffix (v0.2.0-beta.1) makes a pre-release.
#
# Neither installer is signed by a trusted certificate yet. On Windows,
# SmartScreen asks for confirmation. On macOS, the app is only ad-hoc signed
# (tauri.conf.json) and not notarized, so Gatekeeper blocks the first launch:
# right-click → Open, or `xattr -dr com.apple.quarantine /Applications/BiWrite.app`.
# MSI/WiX is intentionally not built (it needs Windows-only tooling and the
# VBSCRIPT optional feature); NSIS is the Windows installer we ship.
name: Build installers

on:
  workflow_dispatch:
  push:
    branches: [master]
    # Path filters don't apply to tag pushes: every version tag builds.
    tags: ["v*"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "crates/**"
      - "package.json"
      - "package-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-installers.yml"

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing shouldn't cancel the other's installer.
      fail-fast: false
      matrix:
        include:
          - name: Windows installer (x64, NSIS)
            os: windows-latest
            rust-targets: ""
            tauri-args: --bundles nsis
            artifact: biwrite-windows-x64-nsis
            path: target/release/bundle/nsis/*.exe
          - name: macOS installer (universal, DMG)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin --bundles dmg
            artifact: biwrite-macos-universal-dmg
            path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $version in src-tauri/tauri.conf.json"
            exit 1
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app and the installer
        run: npx tauri build ${{ matrix.tauri-args }}

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the installers
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          cat > notes.md <<'NOTES'
          ## Install

          | Platform | File |
          |---|---|
          | Windows 10/11 (x64) | `BiWrite_*_x64-setup.exe` |
          | macOS 12+ (Apple Silicon and Intel) | `BiWrite_*_universal.dmg` |

          The installers are not signed with a trusted certificate yet:

          - **Windows:** if SmartScreen says "Windows protected your PC", choose *More info* → *Run anyway*.
          - **macOS:** drag BiWrite into Applications. The first time, right-click the app and choose *Open*, or run `xattr -dr com.apple.quarantine /Applications/BiWrite.app`.

          NOTES
          # A tag with a suffix (v0.2.0-beta.1) is published as a pre-release.
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run: replace the assets of the existing release.
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag "${prerelease[@]}" \
              --title "BiWrite ${TAG#v}" --notes-file notes.md --generate-notes
          fi
