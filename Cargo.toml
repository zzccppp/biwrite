[workspace]
resolver = "3"
members = [
    "src-tauri",
    "crates/biwrite-core",
    "crates/biwrite-engine",
    "crates/biwrite-providers",
    "crates/biwrite-latex",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
biwrite-core = { path = "crates/biwrite-core" }
biwrite-engine = { path = "crates/biwrite-engine" }
biwrite-providers = { path = "crates/biwrite-providers" }
biwrite-latex = { path = "crates/biwrite-latex" }
blake3 = "1.8.7"
serde = { version = "1.0.229", features = ["derive"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
similar = "3.2.0"
thiserror = "2.0.21"
tokio = "1.53.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev.package."*"]
opt-level = 1
