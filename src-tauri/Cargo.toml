[package]
name = "biwrite"
description = "BiWrite: bilingual EN→ZH writing editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "biwrite_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
# Already in the build (via tauri); encodes reference images for requests.
base64 = "0.23"
biwrite-core.workspace = true
biwrite-engine.workspace = true
biwrite-latex.workspace = true
biwrite-providers.workspace = true
keyring.workspace = true
# Both are already part of the build (via keyring and tauri); `local-offset`
# names daily log files by local date.
log = "0.4.34"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# Checks downloaded updates against GitHub's checksum (already in the build).
sha2 = "0.10"
similar.workspace = true
thiserror.workspace = true
tauri = { version = "2.12.2", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.1"
time = { version = "0.3.45", features = ["local-offset"] }
tokio = { workspace = true, features = ["sync"] }
# Skill and template archives; deflate only.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Windows and Linux: a second launch shows the running BiWrite (it may be
# hidden in the tray). macOS keeps one instance by itself.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2.4.5"

[dev-dependencies]
# A mock app around the app state, to call commands in tests.
tauri = { version = "2.12.2", features = ["tray-icon", "test"] }
time = { version = "0.3.45", features = ["macros"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
